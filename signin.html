<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KiliMax</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
    }

    /* NAVBAR */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      position: sticky;
      top: 0;
    }

    .menu-list {
      display: flex;
      align-items: center;
      gap: 20px;
      list-style: none;
    }

    .menu-list a {
      text-decoration: none;
      color: #333;
      font-weight: bold;
      font-size: 18px;
    }

    /* MAIN LAYOUT */
    .container {
      display: flex;
      min-height: 90vh;
    }

    .left img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .left {
      flex: 1;
    }

    .right {
      flex: 1;
      background: yellowgreen;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* FORM CARD */
    .form-card {
      background: white;
      padding: 30px;
      border-radius: 10px;
      width: 80%;
      max-width: 500px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .form-card h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .form-card p {
      text-align: center;
      margin-bottom: 20px;
      color: gray;
    }

    /* FORM */
    .form-group {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      margin-bottom: 5px;
      font-weight: bold;
    }

    .form-group input {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
      transition: 0.3s;
    }

    .form-group input:focus {
      border-color: green;
    }

    /* BUTTON */
    .submit-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: green;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .submit-btn:hover {
      background: darkgreen;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .left {
        height: 200px;
      }
    }

.signin a{
    text-decoration: none;
}

.accept a{
    text-decoration: none;
}

  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav>
    <a href="index.html">
      <img src="icon/log123.jpg" width="70" height="40">
    </a>

    <ul class="menu-list">
      <li><a href="index.html">KILIMax</a></li>
      <li>
        <select>
          <option selected>English</option>
          <option>Portuguese</option>
          <option>French</option>
        </select>
      </li>
    </ul>
  </nav>

  <!-- MAIN -->
  <div class="container">

    <!-- LEFT IMAGE -->
    <div class="left">
      <img src="icon/Register.png" alt="Register">
    </div>

    <!-- RIGHT FORM -->
    <div class="right">
      <div class="form-card">

        <h1>Create Your Account</h1>
        <p>Join KILIMax Partner Network Today</p>

        <form>

          <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="Enter your email" required>
          </div>

          <div class="form-group">
            <label>Phone</label>
            <input type="tel" placeholder="Enter phone number" required>
          </div>

          <div class="form-group">
            <label>Password</label>
            <input type="password" placeholder="Enter password" required>
          </div>

          <div class="form-group">
            <label>Verification Code</label>
            <input type="text" placeholder="Enter code" required>
          </div>

          <button class="submit-btn">Sign In</button>
          <div class="signin">Don't have an account? <a href="signin.html">Sign Up Now</a></div>
          
          <div class="accept">By proceeding, you agree to our <a href="terms.html">Terms of Use</a> and <a href="policy.html">Privacy Policy</a></div>

        </form>

      </div>
    </div>

  </div>

</body>
</html>
